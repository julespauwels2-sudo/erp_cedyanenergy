<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.png">
<meta name="robots" content="noindex, nofollow">
<title>QG de Yann, le magasin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#D6E6F2; --sky2:#F3F7FB;
  --ink:#14213D; --ink-2:#4F5D78; --surface:#FFFFFF; --surface-2:#EEF3F8; --line:#D8E1EB;
  --sun:#F5B700; --alert:#C2410C; --ok:#15803D;
  --shadow:0 20px 44px -20px rgba(20,33,61,.4);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#0B1524; --sky2:#172843; --ink:#EAF0F8; --ink-2:#A3B3CA; --surface:#14223A; --surface-2:#1C2E4B; --line:#2B3F61;
    --alert:#FB923C; --ok:#4ADE80; --shadow:0 20px 44px -20px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky1:#0B1524; --sky2:#172843; --ink:#EAF0F8; --ink-2:#A3B3CA; --surface:#14223A; --surface-2:#1C2E4B; --line:#2B3F61;
  --alert:#FB923C; --ok:#4ADE80; --shadow:0 20px 44px -20px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden;
  background:radial-gradient(120% 90% at 50% 20%,var(--sky2),var(--sky1));transition:background .8s}
body.cyclone{background:radial-gradient(120% 90% at 50% 20%,#5B6577,#2B3240)}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}

.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(16px + env(safe-area-inset-top,0px)) 18px 0;pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.who{display:flex;gap:12px;align-items:center;background:var(--surface);padding:10px 16px 10px 10px;border-radius:18px;box-shadow:var(--shadow)}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--sun);color:#14213D;display:grid;place-items:center;font-weight:800;font-size:22px}
.who h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.lvl{margin:3px 0 0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.lvl b{color:var(--ink)}
.xpbar{width:110px;height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--sun);border-radius:8px;transition:width .5s}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--surface);border:0;padding:11px 15px;border-radius:14px;box-shadow:var(--shadow);font-weight:600;font-size:14px}
.chip b{background:var(--surface-2);padding:2px 8px;border-radius:8px;margin-left:4px}
#btnCyclone[aria-pressed="true"]{background:#B91C1C;color:#fff}
a.chip{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.chip--jaune{background:var(--sun)!important;color:#14213D!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.connexion{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 80% 10%,rgba(251,187,16,.2),transparent 55%),#08170d}
.connexion[hidden]{display:none}
.connexion__carte{width:min(100%,400px);background:#fff;color:#14213D;border-radius:24px;padding:30px;display:grid;gap:12px;box-shadow:0 40px 80px -40px rgba(0,0,0,.8)}
.connexion__carte img{width:170px;height:auto}
.connexion__carte h2{margin:4px 0 0;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.connexion__carte p{margin:0;color:#4F5D78}
.connexion__carte input{min-height:48px;padding:10px 14px;border:1.5px solid #D8E1EB;border-radius:12px;font:inherit;background:#fff;color:#14213D}
.connexion__carte .chip{min-height:48px;justify-content:center;border:0;cursor:pointer}
.lien-co{border:0;background:none;padding:0;color:#4F5D78;text-decoration:underline;cursor:pointer;text-align:left;font:inherit;font-size:.9rem}
.co-msg{min-height:1.2em;font-weight:600;color:#14551f!important}
a.cta,a.ghost{text-decoration:none;display:inline-flex;align-items:center}
a.ghost{color:inherit}

.missions{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:300px;background:var(--surface);
  border-radius:18px;padding:16px;box-shadow:var(--shadow);z-index:4}
.missions h2{margin:0 0 10px;font-size:16px}
.missions ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.missions li button{width:100%;text-align:left;background:var(--surface-2);border:0;border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:14px}
.missions .ck{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.missions .done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.missions .done span.t{text-decoration:line-through;color:var(--ink-2)}
.missions small{color:var(--ink-2);font-variant-numeric:tabular-nums}
.missions[hidden]{display:none}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.zl{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:var(--surface);border-radius:14px;padding:8px 12px 8px 10px;
  display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;box-shadow:var(--shadow);white-space:nowrap;transition:opacity .3s, scale .2s}
.zl::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--surface);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.zl .dot{width:12px;height:12px;border-radius:4px;background:var(--zc)}
.zl .bd{background:var(--sun);color:#14213D;border-radius:9px;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;font-size:13px}
.zl .bd.zero{background:var(--surface-2);color:var(--ink-2)}
.zl:hover{scale:1.06}
.zl.dim{opacity:.35}
.zl.off{opacity:0;pointer-events:none}
.tg{position:absolute;left:0;top:0;border:0;background:var(--surface);border-left:4px solid var(--zc);border-radius:9px;padding:4px 9px;
  font-size:12px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s, scale .15s}
.tg.show{opacity:1;pointer-events:auto}
.tg.pin{width:16px;height:16px;padding:0;border-radius:50%;border:3px solid #fff;background:var(--zc);box-shadow:0 2px 8px rgba(20,33,61,.35)}
.tg.pin .tx{display:none}
.tg.pin.act{width:22px;height:22px;background:var(--alert);display:grid;place-items:center;animation:pulse 1.8s ease-in-out infinite}
.tg.pin.act::before{content:"!";color:#fff;font-size:13px;font-weight:800;line-height:1}
@keyframes pulse{0%,100%{transform-origin:center;box-shadow:0 0 0 0 rgba(234,88,12,.5)}50%{box-shadow:0 0 0 7px rgba(234,88,12,0)}}
.tg.alert:not(.pin){border-left-color:var(--alert);color:var(--alert)}
.tg.hl{scale:1.1}

#panel{position:fixed;right:18px;top:calc(92px + env(safe-area-inset-top,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(430px,calc(100% - 36px));
  background:var(--surface);border-radius:22px;box-shadow:var(--shadow);transform:translateX(calc(100% + 40px));transition:transform .4s cubic-bezier(.2,.8,.2,1);
  overflow:auto;z-index:6;border-top:6px solid var(--zc,var(--sun))}
#panel.open{transform:none}
.p-head{display:flex;gap:12px;align-items:flex-start;padding:18px 18px 8px;position:sticky;top:0;background:var(--surface);z-index:2}
.p-head h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.p-head p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.p-head .x{margin-left:auto;border:0;background:var(--surface-2);width:36px;height:36px;border-radius:12px;font-size:16px;flex:none}
.jump{display:flex;gap:6px;overflow-x:auto;padding:0 18px 10px;position:sticky;top:72px;background:var(--surface);z-index:1;scrollbar-width:none}
.jump button{flex:none;border:1px solid var(--line);background:transparent;border-radius:10px;padding:5px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 18px}
.stats div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink-2)}
.sec{padding:16px 18px 2px;scroll-margin-top:120px}
.sec h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 small{font-weight:400;color:var(--ink-2);font-size:13px}
[id^="h-"]{scroll-margin-top:120px}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:grid;gap:8px}
.row .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row .top b{font-size:15px;display:block}
.meta{font-size:13px;color:var(--ink-2)}
.row.warn{border-color:var(--alert)}
.row.done{opacity:.55}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid.three{grid-template-columns:repeat(3,1fr)}
.tile{border:1px solid var(--line);border-radius:14px;padding:10px 11px;display:grid;gap:3px;align-content:start}
.tile .tn{font-size:13px;font-weight:600;line-height:1.25}
.tile .big{font-size:30px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.grid.three .big{font-size:22px}
.tile .tu{font-size:12px;color:var(--ink-2)}
.tile.low{border-color:var(--alert)}
.tile.low .big{color:var(--alert)}
.tq{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:5px}
.pm{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1;padding:0}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--zc);border-radius:6px;transition:width .4s}
.low .bar i{background:var(--alert)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;background:var(--surface-2);color:var(--ink-2);font-style:normal}
.t-alert{background:rgba(194,65,12,.14);color:var(--alert)}
.t-ok{background:rgba(21,128,61,.14);color:var(--ok)}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cta{border:0;border-radius:11px;padding:8px 12px;font-weight:600;font-size:14px;background:var(--zc);color:#fff}
.cta.sm{padding:5px 9px;font-size:12px;border-radius:9px}
.ghost{border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-size:14px;background:transparent}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:7px;border-radius:5px;background:var(--surface-2)}
.steps i.on{background:var(--zc)}
.mat{display:flex;flex-wrap:wrap;gap:5px}
.stage{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:14px 0 6px}
.stage:first-of-type{margin-top:0}
.stage i{width:11px;height:11px;border-radius:3px}
.stage small{color:var(--ink-2);font-weight:400}
.plan{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.plan li b{color:var(--ink-2);font-weight:600}
.empty{color:var(--ink-2);font-size:14px;background:var(--surface-2);border-radius:12px;padding:12px;margin:0}
.pad{height:18px}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px}
.line > div:first-child{min-width:0}
.line b{display:block;font-size:15px}
.type{display:block;font-size:12px;font-weight:600;color:var(--c)}
.row[style*="--c"]{border-left:4px solid var(--c)}
.ghost.sm{padding:5px 9px;font-size:12px;border-radius:9px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.list li span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.list li.low span:last-child{color:var(--alert)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.board div{background:var(--surface-2);border-radius:12px;padding:9px;border-top:4px solid var(--c);display:grid;gap:2px}
.board b{font-size:22px;font-weight:800}
.board span{font-size:11px;color:var(--ink-2);line-height:1.25}
@media (max-width:760px){.board{grid-template-columns:1fr 1fr}}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--zc)}100%{box-shadow:0 0 0 0 transparent}}
.flash{animation:flash 1.8s ease-out;border-radius:14px}

.hint{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);margin:0;background:var(--surface);
  padding:9px 14px;border-radius:12px;font-size:13px;color:var(--ink-2);box-shadow:var(--shadow);z-index:2;transition:opacity .4s;white-space:nowrap}
.hint.gone{opacity:0}
#toasts{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:8;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{background:#14213D;color:#fff;border-radius:14px;padding:10px 16px;display:flex;gap:10px;align-items:baseline;box-shadow:var(--shadow);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.toast b{color:var(--sun);font-size:18px;font-weight:800;flex:none}
.toast.big{background:var(--sun);color:#14213D}
.toast.big b{color:#14213D}
.toast.warn{background:#9A3412}
.toast.warn b{color:#FED7AA}
@keyframes pop{from{transform:translateY(-10px) scale(.9);opacity:0}}
#cycloneBanner{position:fixed;left:50%;top:calc(92px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#B91C1C;color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;z-index:4;box-shadow:var(--shadow);max-width:calc(100% - 36px);text-align:center}
#cycloneBanner[hidden]{display:none}

@media (max-width:760px){
  .hud{flex-direction:column;align-items:stretch}
  .actions{justify-content:flex-start}
  .xpbar{width:80px}
  .missions{left:12px;right:12px;width:auto;top:calc(150px + env(safe-area-inset-top,0px));bottom:auto}
  #panel{left:0;right:0;top:auto;bottom:0;width:100%;height:62vh;border-radius:22px 22px 0 0;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.open{transform:none}
  .stats b{font-size:16px}
  .grid.three{grid-template-columns:1fr 1fr}
  #toasts{top:auto;bottom:calc(64vh + 8px)}
  #cycloneBanner{top:calc(150px + env(safe-area-inset-top,0px))}
  .hint{white-space:normal;text-align:center;width:max-content;max-width:calc(100% - 32px)}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<canvas id="c" aria-label="Vue 3D du magasin de Yann"></canvas>

<header class="hud">
  <div class="who">
    <div class="avatar" aria-hidden="true">Y</div>
    <div>
      <h1>QG de Yann</h1>
      <p class="lvl"><b id="lvl">Niveau 4</b><span class="xpbar"><i id="xpfill"></i></span><span id="xptxt"></span></p>
    </div>
  </div>
  <div class="actions">
    <a class="chip chip--jaune" href="devis.html?nouveau">Faire un devis</a>
    <a class="chip" href="devis.html">Devis</a>
    <a class="chip" href="stock.html">Stock</a>
    <a class="chip" href="chantiers.html">Chantiers</a>
    <a class="chip" href="sav.html">SAV</a>
    <a class="chip" href="https://cedyan-energy.net/dashboard.html" target="_blank" rel="noopener">Tableau de bord</a>
    <button class="chip" id="btnMissions" aria-expanded="true" aria-controls="missions">Missions du jour <b id="mcount">0/4</b></button>
    <button class="chip" id="btnCyclone" aria-pressed="false">Alerte cyclone</button>
    <button class="chip" id="btnSortir">Quitter</button>
  </div>
</header>

<section id="missions" class="missions" aria-label="Missions du jour">
  <h2>Missions du jour</h2>
  <ul id="mlist"></ul>
</section>

<div id="cycloneBanner" role="status" hidden>Vigilance cyclonique : chantiers suspendus, stock à sécuriser.</div>
<div id="labels"></div>
<aside id="panel" aria-hidden="true" aria-labelledby="ptitle"><div id="pbody"></div></aside>
<p class="hint" id="hint">Les points orange demandent ton attention. Clique dessus pour voir.</p>
<div id="toasts" aria-live="polite"></div>
<section class="connexion" id="connexion" hidden>
  <form class="connexion__carte" id="form-co" novalidate>
    <img src="logo-cedyan.png" alt="Cedyan Energy" width="180" height="54">
    <h2>QG de Yann</h2>
    <p>Même accès que le tableau de bord.</p>
    <label class="sr" for="co-email">E-mail</label><input id="co-email" type="email" autocomplete="username" placeholder="E-mail">
    <label class="sr" for="co-mdp">Mot de passe</label><input id="co-mdp" type="password" autocomplete="current-password" placeholder="Mot de passe">
    <button class="chip chip--jaune" type="submit">Se connecter</button>
    <button class="lien-co" type="button" id="co-lien">Première connexion ou mot de passe oublié ? Recevoir un lien par e-mail</button>
    <p class="co-msg" id="co-msg" role="status" aria-live="polite"></p>
  </form>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
"use strict";
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const euro = n => n.toLocaleString('fr-FR') + ' €';
const pl = (n,s,p) => n + ' ' + (n>1 ? (p||s+'s') : s);
const MOBILE = () => innerWidth < 760;

/* =============== Données réelles (base Supabase de Cedyan) =============== */
const SUPA_URL = "https://uotqqkhraqxtlssgavlm.supabase.co";
const SUPA_CLE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvdHFxa2hyYXF4dGxzc2dhdmxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNDI1NTAsImV4cCI6MjEwNjgxODU1MH0.61NliFrPeWNilEmXPayAONTIVF49tmq3arjgdzSwPpM";
const SITE = "https://cedyan-energy.net";
const sb = window.supabase.createClient(SUPA_URL, SUPA_CLE);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const euroD = (n) => (Number(n) || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const dateC = (d) => d ? new Date(d).toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : "";
const S = { open:null, cyclone:false, moi:null };
const DATA = { demandes:[], devis:[], kbis:[], produits:[], pose:[], stock:[], receptions:0, sav:[], chantiers:[] };

// Le stock est rangé par familles du catalogue (les quantités arriveront avec l'étape Stock)
const BAIES = {
  pv:   { nom:"Panneaux", cats:["panneaux"] },
  ond:  { nom:"Onduleurs et régulateurs", cats:["onduleurs","convertisseurs","regulateurs"] },
  bat:  { nom:"Batteries", cats:["batteries"] },
  small:{ nom:"Petit matériel", cats:["protections","cables","structures","monitoring"] },
  recv: { nom:"Kits et centrales", cats:["kits"] },
};
const baie = (k) => DATA.produits.filter((p) => p.actif && BAIES[k].cats.includes(p.cat));
const enStock = (l) => l.filter((p) => p.dispo === "stock").length;
// Stock réel (Dolibarr) : par famille, et ce qui passe sous le seuil d'alerte
const stockBaie = (k) => DATA.stock.filter((s) => BAIES[k].cats.includes(s.cat));

async function charger() {
  const [dm, dv, kb, pr, st, rc, sv, ch] = await Promise.all([
    sb.from("demandes").select("id,created_at,type,statut,contact,installateur,profil,pour_quand").order("created_at", { ascending: false }).limit(300),
    sb.from("devis").select("id,numero,statut,total_ttc,created_at,envoye_le,accepte_le,valide_jusqu,a_appeler,vu_le,demande:demandes(contact)").order("created_at", { ascending: false }).limit(500),
    sb.from("comptes_pro").select("id,entreprise,nom,metier,statut,created_at").eq("statut", "en_attente").order("created_at"),
    sb.from("produits").select("id,cat,actif,produits_prive(dispo)").limit(3000),
    sb.from("stock_vue").select("ref,libelle,cat,reel,reserve,disponible,seuil_alerte,en_alerte").limit(5000),
    sb.from("stock_receptions").select("id", { count: "exact", head: true }).eq("statut", "a_valider"),
    sb.from("sav").select("id,numero,nom,commune,priorite,statut,creneau,created_at,diagnostic").in("statut", ["nouveau", "planifie", "en_cours"]).order("created_at", { ascending: false }).limit(200),
    sb.from("chantiers").select("id,numero,client_nom,commune,kwc,etape,date_visite,date_pose,date_mise_en_service,created_at").neq("etape", "annule").order("created_at").limit(500),
  ]);
  DATA.chantiers = ch.error ? [] : (ch.data || []);
  DATA.sav = sv.error ? [] : (sv.data || []);
  const err = [dm, dv, kb, pr].find((r) => r.error); if (err) throw err.error;
  DATA.stock = st.error ? [] : (st.data || []); DATA.receptions = rc.error ? 0 : (rc.count || 0);
  DATA.demandes = dm.data || []; DATA.devis = dv.data || []; DATA.kbis = kb.data || [];
  DATA.produits = (pr.data || []).map((p) => { const x = Array.isArray(p.produits_prive) ? p.produits_prive[0] : p.produits_prive; return { id:p.id, cat:p.cat, actif:p.actif, dispo:x?.dispo || null }; });
  DATA.pose = DATA.demandes.filter((d) => d.installateur === "pose_enr" && !["gagne","perdu","expire"].includes(d.statut));
}

// Maison 1,6 × 1,6 : toit en pyramide (4 pans réguliers), panneaux posés sur le pan tourné vers la caméra
function maison(p,x,z,finie,k){
  const W=1.6, mur=COULEURS_MURS[k%COULEURS_MURS.length];
  if(!finie){
    box(p,W,.62,W,mur,x,.12,z);                                             // murs en cours de montage
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>box(p,.07,1.45,.07,0xF08C00,x+a*(W/2+.18),.12,z+b*(W/2+.18)));   // échafaudage

    return;
  }
  box(p,W,1,W,mur,x,.12,z);                                                 // murs
  const h=.8, r=(W/2+.12)*Math.SQRT2;                                       // toit qui déborde un peu
  const t=new THREE.Mesh(new THREE.ConeGeometry(r,h,4),toitMat); t.rotation.y=Math.PI/4; t.position.set(x,1.12+h/2,z); t.castShadow=true; p.add(t);
  const pente=Math.atan2(h,W/2+.12);
  const pan=solar(p,.95,.62,x,1.12+h/2+.02,z+(W/2+.12)/2+.04,pente);       // panneaux sur le pan avant
  box(p,.34,.62,.04,0x7A5A40,x+.35,.12,z+W/2+.01);                          // porte
  box(p,.36,.3,.04,0xBFE3F2,x-.35,.52,z+W/2+.01);                           // fenêtre
  box(p,.03,.7,.03,0x334155,x-W/2-.2,.12,z+W/2+.1); box(p,.32,.2,.02,0x22C55E,x-W/2-.03,.6,z+W/2+.1);   // drapeau vert
}

const PARCELLES=(()=>{ const L=[];
  for(let i=0;i<5;i++) for(let j=0;j<5;j++){ if(i===2&&j===2) continue;          // îlot central = le magasin
    const x0=RUES_X[i]+LARG/2+.8, x1=RUES_X[i+1]-LARG/2-.8, z0=RUES_Z[j]+LARG/2+.8, z1=RUES_Z[j+1]-LARG/2-.8;
    const nx=Math.max(1,Math.floor((x1-x0)/5.4)), nz=Math.max(1,Math.floor((z1-z0)/5.4));
    for(let a=0;a<nx;a++) for(let b=0;b<nz;b++) L.push([x0+(a+.5)*(x1-x0)/nx, z0+(b+.5)*(z1-z0)/nz]); }
  // Les plus proches du QG d'abord (légère priorité à l'arrière, pour ne jamais cacher le magasin)
  return L.sort((p,q)=>(Math.hypot(...p)+(p[0]+p[1])*.12)-(Math.hypot(...q)+(q[0]+q[1])*.12));
})();
function emplacements(n){ return PARCELLES.slice(0,n); }

function sph(p,r,c,x,y,z,sy,half){ const k=r+'|'+(half?1:0);

function rcyl(p,r,h,c,x,y,z){ const k='rc'+r+'|'+h; const geo=sgeos[k]||(sgeos[k]=new THREE.CylinderGeometry(r,r,h,22));

function buddy(parent,o,x,y,z,ry){

  if(o.vest) rcyl(g,.285,.24,o.vest,0,.48,0);

  [-1,1].forEach(s=>{ sph(h,.045,0x1A1A1A,s*.11,.03,.29); sph(h,.05,0xF4A3A3,s*.19,-.07,.25,.6); });
  if(o.hat==='hard'){ sph(h,.345,o.hatC,0,.05,0,1,true); rcyl(h,.42,.035,o.hatC,0,.03,0); }
  else if(o.hat==='cap'){ sph(h,.338,o.hatC,0,.05,0,1,true); box(h,.32,.04,.24,o.hatC,0,.04,.33); }

  if(o.carry==='panel'){ const p=solar(g,.95,.7,.48,.8,0); p.rotation.z=Math.PI/2; }

function stepBuddy(b,dt){
  const o=b.o, g=b.g; b.t+=dt; let walking=false;
  if(o.path && !REDUCED){
    if(b.wait>0) b.wait-=dt;
    else { const tg=o.path[(b.i+1)%o.path.length], dx=tg[0]-g.position.x, dz=tg[1]-g.position.z, d=Math.hypot(dx,dz);
      if(d<.05){ b.i=(b.i+1)%o.path.length; b.wait=o.pause||.9; }
      else { const st=Math.min(d,(o.speed||1.2)*dt); g.position.x+=dx/d*st; g.position.z+=dz/d*st;
        let df=Math.atan2(dx,dz)-g.rotation.y; df=Math.atan2(Math.sin(df),Math.cos(df)); g.rotation.y+=df*Math.min(1,dt*10); walking=true; } }
  }
  const w=Math.sin(b.t*9);
  b.legs[0].rotation.x=walking?w*.6:0; b.legs[1].rotation.x=walking?-w*.6:0;
  if(o.carry==='box') b.arms.forEach(a=>a.rotation.x=-1.25);
  else if(o.carry==='panel'){ b.arms[1].rotation.z=.35; b.arms[0].rotation.x=walking?-w*.5:0; }
  else if(o.act==='hammer') b.arms[1].rotation.x=REDUCED?-1.2:-1.3+Math.sin(b.t*10)*.55;
  else if(o.act==='wave'){ const c=b.t%6; b.arms[1].rotation.z=(!REDUCED&&c<1.6)?2.5+Math.sin(b.t*12)*.35:0; }
  else { b.arms[0].rotation.x=walking?-w*.5:0; b.arms[1].rotation.x=walking?w*.5:0; }
  g.position.y=b.base+(walking?Math.abs(Math.sin(b.t*9))*.07:(REDUCED?0:Math.sin(b.t*2)*.015));
  b.head.rotation.z=walking||REDUCED?0:Math.sin(b.t*1.3)*.08;
}

/* Sélection */
let pickables=[];
let hotGroups=[];
function collect(){ hotGroups=[]; Object.values(Z).forEach(z=>z.group.traverse(o=>{ if(o.isGroup&&o.userData.hot){ o.userData.y0=o.userData.y0??o.position.y; hotGroups.push(o); } })); pickables=[]; Object.values(Z).forEach(z=>z.group.traverse(o=>{ if(o.isMesh) pickables.push(o); })); }
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(cx,cy){
  const r=canvas.getBoundingClientRect(); ndc.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera); const hit=ray.intersectObjects(pickables,false)[0]; if(!hit) return null;
  let o=hit.object, hot=null; while(o){ if(!hot && o.userData.hot) hot=o.userData.hot; if(o.userData.zone) return {zone:o.userData.zone, hot}; o=o.parent; }
  return null;
}

const view={target:V3(0,0,0), zoom:REDUCED?1:.72, yaw:0}, goal={target:V3(0,0,0), zoom:1, yaw:0}, vueGenerale={x:0, zoom:1};
function resize(){ const w=innerWidth, h=innerHeight, a=w/h; renderer.setSize(w,h,false);
  const t=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)); BASE=Math.max(11.2/t,16.5/(t*a));   // le magasin entier à l'écran, quel que soit le format
  camera.aspect=a; camera.updateProjectionMatrix(); }
addEventListener('resize',()=>{ resize(); if(S.open) focusZone(S.open); });
resize();
function focusZone(id){
  const z=ZONES[id], zoom=z.zoom*(MOBILE()?.85:1);
  camera.updateMatrixWorld();
  const right=V3().setFromMatrixColumn(camera.matrixWorld,0).setY(0).normalize();
  const up=V3().setFromMatrixColumn(camera.matrixWorld,1);
  const wpp=2*(BASE/zoom)*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))/innerHeight, t=z.center.clone();
  if(MOBILE()) t.addScaledVector(up,-innerHeight*.27*wpp); else t.addScaledVector(right,225*wpp);
  goal.target.copy(t); goal.zoom=zoom;
}

const tmp=V3();
function placeLabels(){
  const W=innerWidth, H=innerHeight, items=[];
  Object.entries(ZONES).forEach(([id,z])=>{
    const el=labelEls[id], off=S.open===id;
    el.classList.toggle('off',off); el.classList.toggle('dim',!!S.open&&!off);
    if(off) return;
    tmp.copy(z.center); tmp.y=z.labelY+Z[id].lift; tmp.project(camera);
    items.push({el,x:(tmp.x*.5+.5)*W,y:(-tmp.y*.5+.5)*H-8,prio:0});
  });
  Object.entries(HOT).forEach(([id,h])=>{
    const el=tagEls[id], hov=!!hovered&&hovered.hot===id;
    const full=S.open===h.zone || (!S.open&&hov), pin=!S.open&&!hov, show=full||pin;
    el.classList.toggle('show',show); el.classList.toggle('pin',pin); el.classList.toggle('hl',false);
    if(!show) return;
    tmp.copy(h.at); tmp.y+=Z[h.zone].lift; tmp.project(camera);
    items.push({el,x:(tmp.x*.5+.5)*W,y:(-tmp.y*.5+.5)*H,prio:pin?2:1});
  });
  // Anti-chevauchement : chaque étiquette prend la place libre la plus proche de son objet
  items.forEach(i=>{ i.w=i.el.offsetWidth; i.h=i.el.offsetHeight; });
  items.sort((a,b)=>a.prio-b.prio || b.y-a.y);
  const placed=[], G=4;
  const hits=(l,t,w,h)=>placed.some(p=>l<p.r+G && l+w>p.l-G && t<p.b+G && t+h>p.t-G);
  items.forEach(i=>{
    const l0=i.x-i.w/2, t0=i.y-i.h, sy=i.h+G, sx=i.w/2+G;
    let best=null;
    for(let ring=0;ring<8 && !best;ring++){
      const cands=[];
      for(let dy=-ring;dy<=ring;dy++) for(let dx=-ring;dx<=ring;dx++){
        if(Math.max(Math.abs(dx),Math.abs(dy))!==ring) continue;
        cands.push([dx*sx,dy*sy]);
      }
      cands.sort((a,b)=>(Math.hypot(a[0],a[1]*1.6))-(Math.hypot(b[0],b[1]*1.6)));
      for(const [dx,dy] of cands){ if(!hits(l0+dx,t0+dy,i.w,i.h)){ best=[l0+dx,t0+dy]; break; } }
    }
    if(!best) best=[l0,t0];
    placed.push({l:best[0],r:best[0]+i.w,t:best[1],b:best[1]+i.h});
    i.el.style.transform=`translate(${Math.round(best[0])}px,${Math.round(best[1])}px)`;
  });
}

// XP et niveau gardés sur l'appareil : chaque tâche réglée rapporte des points
const J = (()=>{ try{ return JSON.parse(localStorage.getItem('qg-jeu')||'{}'); }catch{ return {}; } })();
J.xp=J.xp||0; J.niveau=J.niveau||1;
const sauverJeu=()=>{ try{ localStorage.setItem('qg-jeu',JSON.stringify(J)); }catch{} };
const need = l => 250 + l*40;
function gain(n,why){
  J.xp+=n; toast('+'+n+' XP',why);
  while(J.xp>=need(J.niveau)){ J.xp-=need(J.niveau); J.niveau++; const L=J.niveau; setTimeout(()=>toast('Niveau '+L,'Nouveau niveau atteint, bravo Yann','big'),450); }
  sauverJeu(); hud();
}
function hud(){
  document.getElementById('lvl').textContent='Niveau '+J.niveau;
  document.getElementById('xpfill').style.width=(J.xp/need(J.niveau)*100)+'%';
  document.getElementById('xptxt').textContent=J.xp+' / '+need(J.niveau)+' XP';
}
// Missions du jour : le matin, on note ce qu'il y a à faire ; chaque élément réglé fait avancer la mission
function missions(){
  const jour=new Date().toLocaleDateString('en-CA');
  const actuel={ valider:devisSt('brouillon').length, envoyer:devisSt('valide').length, appeler:aAppeler().length, kbis:DATA.kbis.length };
  if(J.jour!==jour){ J.jour=jour; J.depart={...actuel}; J.fait={}; J.vu={}; }
  Object.keys(actuel).forEach(k=>{ if(actuel[k]>J.depart[k]) J.depart[k]=actuel[k]; }); // nouvelles arrivées dans la journée
  const m=(id,t,k,h)=>({ id,t,h,z:'cedyan',n:J.depart[k],p:Math.max(0,J.depart[k]-actuel[k]) });
  return [ m('m1','Valider les devis du comptoir','valider','todo'), m('m2','Envoyer les devis validés','envoyer','todo'), m('m3','Appeler les clients à relancer','appeler','todo'), m('m4','Décider pour les Kbis','kbis','todo') ];
}
function refresh(){
  const ms=missions(); let done=0;
  document.getElementById('mlist').innerHTML=ms.map(m=>{ const rien=m.n===0, ok=rien||m.p>=m.n; if(ok) done++;
    return `<li class="${ok?'done':''}"><button data-z="${m.z}" data-h="${m.h}"><span class="ck">${ok?'✓':''}</span><span class="t">${m.t}</span><small>${rien?'rien à faire':m.p+'/'+m.n}</small></button></li>`; }).join('');
  document.getElementById('mcount').textContent=done+'/'+ms.length;
  ms.forEach(m=>{
    const avant=J.vu[m.id]||0; if(m.p>avant){ gain((m.p-avant)*15, m.t); J.vu[m.id]=m.p; }
    if(m.n>0 && m.p>=m.n && !J.fait[m.id]){ J.fait[m.id]=true; setTimeout(()=>gain(50,'Mission terminée : '+m.t.toLowerCase()),800); }
  });
  sauverJeu(); rebuild(); updateLabels();
}

const k=REDUCED?1:.09; let t0=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-t0)/1000); t0=now;
  view.target.lerp(goal.target,k); view.zoom+=(goal.zoom-view.zoom)*k; view.yaw+=(goal.yaw-view.yaw)*k;
  camera.position.copy(view.target).add(OFFSET.clone().normalize().multiplyScalar(BASE/view.zoom).applyAxisAngle(V3(0,1,0),view.yaw));
  camera.lookAt(view.target);
  if(!REDUCED) bougerVoitures(dt);
  const hz=hovered&&hovered.zone;
  Object.entries(Z).forEach(([id,z])=>{
    const on=hz===id||S.open===id; if(id!=='quartier'){ z.lift+=((on?.22:0)-z.lift)*(REDUCED?1:.15); z.group.position.y=z.lift; }
    z.plate.emissive.setHex(on?ZONES[id].hex:0x000000); z.plate.emissiveIntensity=on?.25:0;
  });
  if(!REDUCED) beacons.forEach(b=>{ b.material.emissiveIntensity=.4+.6*(Math.sin(now/180)*.5+.5); });
  if(rain.visible){ const p=rainGeo.attributes.position.array;
    for(let i=0;i<RN;i++){ const o=i*6, dy=dt*22; p[o+1]-=dy; p[o+4]-=dy; p[o]-=dt*4; p[o+3]-=dt*4;
      if(p[o+4]<0){ const x=(Math.random()-.5)*34, z=(Math.random()-.5)*30; p[o]=x; p[o+1]=18; p[o+2]=z; p[o+3]=x-.15; p[o+4]=17.3; p[o+5]=z; } }
    rainGeo.attributes.position.needsUpdate=true; }
  const hh=hovered&&hovered.hot;
  hotGroups.forEach(o=>{ const tgt=o.userData.y0+(o.userData.hot===hh?.18:0); o.position.y+=(tgt-o.position.y)*(REDUCED?1:.2); });
  buddies.forEach(b=>stepBuddy(b,dt));
  renderer.render(scene,camera); placeLabels();
  requestAnimationFrame(loop);
}
/* Connexion (même accès que le tableau de bord) */
const ecranCo=document.getElementById('connexion');
function montrerConnexion(msg){ ecranCo.hidden=false; document.getElementById('co-msg').textContent=msg||''; document.getElementById('co-email').focus(); }
document.getElementById('form-co').addEventListener('submit',async(e)=>{
  e.preventDefault(); const em=document.getElementById('co-email').value.trim().toLowerCase(), mdp=document.getElementById('co-mdp').value, msg=document.getElementById('co-msg');
  if(!mdp){ msg.textContent='Saisis ton mot de passe, ou reçois un lien juste en dessous.'; return; }
  msg.textContent='Connexion…';
  const { error }=await sb.auth.signInWithPassword({ email:em, password:mdp });
  if(error){ msg.textContent='E-mail ou mot de passe incorrect.'; return; }
  demarrer();
});
document.getElementById('co-lien').addEventListener('click',async()=>{
  const em=document.getElementById('co-email').value.trim().toLowerCase(), msg=document.getElementById('co-msg');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ msg.textContent="Saisis d'abord ton e-mail."; return; }
  await sb.auth.signInWithOtp({ email:em, options:{ shouldCreateUser:false, emailRedirectTo:location.origin+location.pathname } });
  msg.textContent='Si cette adresse a accès, un lien de connexion vient de partir.';
});
document.getElementById('btnSortir').addEventListener('click',async()=>{ await sb.auth.signOut(); location.reload(); });

async function demarrer(){
  const { data:{ session } }=await sb.auth.getSession();
  if(!session) return montrerConnexion();
  const { data:eq }=await sb.from('staff').select('email,nom').ilike('email',session.user.email).maybeSingle();
  if(!eq){ await sb.auth.signOut(); return montrerConnexion("Ce compte n'a pas accès au QG."); }
  ecranCo.hidden=true; S.moi=eq;
  document.querySelector('.who h1').textContent='QG de '+(eq.nom||'Yann').split(' ')[0];
  try{ await charger(); }catch(err){ toast('Oups','Données indisponibles : '+(err.message||err),'warn'); }
  hud(); refresh();
  setInterval(async()=>{ if(document.hidden) return; try{ await charger(); refresh(); if(S.open){ const y=panel.scrollTop; render(); panel.scrollTop=y; } }catch{} },60000);
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_IN' && !S.moi) demarrer(); });
requestAnimationFrame(loop);
demarrer();
})();
</script>
