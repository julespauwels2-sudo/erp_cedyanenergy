<style>

.carte{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 14px 34px -22px rgba(20,60,30,.4)}

dialog{border:0;border-radius:22px;padding:20px;width:min(94vw,420px)}dialog::backdrop{background:rgba(6,42,39,.6)}

</head>

  if (MOI.metier !== "poseur") t.push(sb.from("sav").select("*, installation:installations(*)").in("statut", ["planifie", "en_cours", "resolu"]).not("technicien_email", "is", null).order("creneau").limit(300).then((r) => (L.sav = r.data || [])));

/* ---------- Interventions SAV ---------- */
function listeSav() {
  if (ouvert) { const s = L.sav.find((x) => x.id === ouvert); if (s) return ficheSav(s); ouvert = null; }

async function lien(bucket, chemin) { const { data } = await sb.storage.from(bucket).createSignedUrl(chemin, 3600); return data?.signedUrl || ""; }
function signature(cv, existante) {
  const ctx = cv.getContext("2d"); let trace = false, signe = !!existante;
  const r = cv.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio); ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.strokeStyle = "#16241a";
  if (existante) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, r.height); im.src = existante; }
  const pos = (e) => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };

    <div class="actions"><input type="text" id="signe" placeholder="Nom du client" value="${esc(R.signe_par || s.nom || "")}" style="grid-column:1/-1"><button class="btn" id="effacer" type="button">Effacer</button><button class="btn" id="sauver" type="button">Enregistrer</button></div>
    <button class="btn teal large" id="terminer" style="margin-top:6px">${s.statut === "resolu" ? "Mettre à jour le rapport" : "✅ Terminer l'intervention"}</button>
    ${s.statut === "resolu" ? `<button class="btn jaune large" id="rapport" style="margin-top:8px">${s.rapport_envoye_le ? "Renvoyer" : "Envoyer"} le rapport au client</button>` : ""}</section>`;
  document.getElementById("ret").onclick = () => { ouvert = null; rendre(); };
  for (const c of s.photos || []) { const u = await lien("sav", c); if (u) document.getElementById("ph").insertAdjacentHTML("beforeend", `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Photo du client"></a>`); }
  const dessiner = async () => { const z = document.getElementById("rph"); z.innerHTML = ""; for (const c of photos) { const u = await lien("sav", c); if (u) z.insertAdjacentHTML("beforeend", `<img src="${esc(u)}" alt="">`); } };
  dessiner();
  const sig = signature(document.getElementById("sig"), R.signature);
  document.getElementById("effacer").onclick = sig.effacer;
  const lire = (fini) => ({ checklist: checklist.map((c, k) => ({ texte: c.texte, fait: document.querySelector(`[data-k="${k}"]`).checked })), notes: document.getElementById("notes").value.trim(), photos,
    signe_par: document.getElementById("signe").value.trim() || null, signature: sig.image(), termine_le: fini ? new Date().toISOString() : (R.termine_le || null), par: MOI.nom });
  const sauver = async (fini) => { const ch = { rapport: lire(fini), updated_at: new Date().toISOString() }; if (fini) ch.statut = "resolu"; else if (s.statut === "planifie") ch.statut = "en_cours";
    const { error } = await sb.from("sav").update(ch).eq("id", s.id); if (error) { info("Erreur : " + error.message, true); return false; } Object.assign(s, ch); info(fini ? "Intervention terminée 👍" : "Enregistré"); return true; };
  document.getElementById("rphoto").onchange = async (e) => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    const ch = `rapports/${s.id}/${Date.now()}.${(f.type.split("/")[1] || "jpg").replace("jpeg", "jpg")}`; const { error } = await sb.storage.from("sav").upload(ch, f, { contentType: f.type });
    if (error) return info("Photo non envoyée : " + error.message, true); photos.push(ch); dessiner(); sauver(false); };
  document.getElementById("commencer")?.addEventListener("click", async () => { if (await sauver(false)) { await charger(); rendre(); } });
  document.getElementById("sauver").onclick = () => sauver(false);
  document.getElementById("terminer").onclick = async () => { if (await sauver(true)) { await charger(); rendre(); } };
  document.getElementById("rapport")?.addEventListener("click", async (e) => { e.target.disabled = true;
    const { data, error } = await sb.functions.invoke("sav", { body: { action: "envoyer_rapport", sav_id: s.id } });
    e.target.disabled = false; if (error || !data?.ok) return info(data?.erreur || "Envoi impossible", true); info("Rapport envoyé au client"); await charger(); rendre(); });
}

/* ---------- Chantiers ---------- */
function listeCh() {
  if (ouvert) { const c = L.ch.find((x) => x.id === ouvert); if (c) return ficheCh(c); ouvert = null; }
  const enCours = L.ch.filter((c) => c.etape !== "termine"), finis = L.ch.filter((c) => c.etape === "termine").slice(0, 10);
  const carte = (c) => `<button class="item ${c.etape === "termine" ? "fini" : ""}" data-id="${c.id}">${c.date_pose ? `<span class="heure">Pose le ${jourTxt(c.date_pose)}</span><br>` : ""}<b>${esc(c.client_nom)}</b>
    <span class="meta">${esc(c.commune || "")}${c.kwc ? " · " + c.kwc + " kWc" : ""} · ${esc(ETAPE[c.etape] || "")}${(c.pose || {}).terminee_le ? " · pose terminée ✓" : ""}</span></button>`;
  app.innerHTML = `<p class="titre-sec">Mes chantiers</p>${enCours.map(carte).join("") || `<p class="vide carte">Aucun chantier pour l'instant.</p>`}${finis.length ? `<p class="titre-sec">Terminés</p>${finis.map(carte).join("")}` : ""}`;
  app.querySelectorAll("[data-id]").forEach((b) => (b.onclick = () => { ouvert = b.dataset.id; rendre(); scrollTo(0, 0); }));
}
async function ficheCh(c) {
  const V = c.visite || {}, P = c.pose || {}, adresse = [c.adresse, c.commune].filter(Boolean).join(", "), photos = [...(c.photos || [])];
  const checklist = P.checklist || CHECK_POSE.map((t) => ({ texte: t, fait: false }));
  const rel = [["Toiture", V.toiture], ["Orientation", V.orientation], ["Inclinaison", V.inclinaison ? V.inclinaison + "°" : ""], ["Surface", V.surface ? V.surface + " m²" : ""], ["Ombrage", V.ombrage], ["Compteur", V.compteur], ["Puissance souscrite", V.kva ? V.kva + " kVA" : ""], ["Tableau", V.tableau], ["Distance onduleur ↔ tableau", V.distance ? V.distance + " m" : ""]].filter(([, v]) => v);
  app.innerHTML = `<button class="btn" id="ret" style="min-height:44px;margin-bottom:10px">← Mes chantiers</button>
  <section class="carte"><h2>${esc(c.client_nom)}</h2><p class="meta">${esc(c.numero)}${c.kwc ? " · " + c.kwc + " kWc" : ""}${c.date_pose ? " · pose le " + jourTxt(c.date_pose) : ""}${adresse ? "<br>" + esc(adresse) : ""}</p>
    <div class="actions">${c.telephone ? `<a class="btn teal" href="${telLien(c.telephone)}">📞 Appeler</a>` : ""}${adresse ? `<a class="btn" href="${itineraire(adresse)}" target="_blank" rel="noopener">🧭 Itinéraire</a>` : ""}</div>
    ${(c.materiel || []).length ? `<h3>Matériel à poser</h3><ul class="liste-mat">${c.materiel.map((m) => `<li><span>${esc(m.libelle)}</span><b>× ${esc(m.quantite)}</b></li>`).join("")}</ul>` : ""}
    ${rel.length ? `<h3>Relevés de la visite</h3><div class="releves">${rel.map(([k, v]) => `<div><span>${k}</span>${esc(v)}</div>`).join("")}</div>${V.notes ? `<p class="meta">📝 ${esc(V.notes)}</p>` : ""}` : ""}</section>
  <section class="carte"><h2>La pose</h2><div class="check">${checklist.map((x, k) => `<label><input type="checkbox" data-k="${k}" ${x.fait ? "checked" : ""}>${esc(x.texte)}</label>`).join("")}</div>
    <h3>Notes</h3><textarea id="notes" placeholder="Ce qui s'est passé, ce qui reste à faire…">${esc(P.notes || "")}</textarea>
    <h3>Photos du chantier</h3><div class="photos" id="ph"></div><p class="fichier"><label class="btn">📷 Ajouter une photo<input type="file" id="photo" accept="image/*"></label></p>
    <div class="actions"><button class="btn" id="sauver" type="button" style="grid-column:1/-1">Enregistrer</button></div>
    <button class="btn teal large" id="fini">${P.terminee_le ? "Mettre à jour" : "✅ Pose terminée"}</button>
    ${P.terminee_le ? `<p class="meta" style="text-align:center">Pose déclarée terminée le ${jourTxt(P.terminee_le)}${P.par ? " par " + esc(P.par) : ""}. Yann s'occupe de la mise en service.</p>` : ""}</section>`;
  document.getElementById("ret").onclick = () => { ouvert = null; rendre(); };
  const dessiner = async () => { const z = document.getElementById("ph"); z.innerHTML = ""; for (const p of photos) { const u = await lien("chantiers", p); if (u) z.insertAdjacentHTML("beforeend", `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt=""></a>`); } };
  dessiner();
  const lire = (fini) => ({ checklist: checklist.map((x, k) => ({ texte: x.texte, fait: document.querySelector(`[data-k="${k}"]`).checked })), notes: document.getElementById("notes").value.trim(), terminee_le: fini ? new Date().toISOString() : (P.terminee_le || null), par: fini ? MOI.nom : (P.par || null) });
  const sauver = async (fini) => { const ch = { pose: lire(fini), photos, updated_at: new Date().toISOString() }; if (fini && ["pose", "demarches", "visite"].includes(c.etape)) ch.etape = "mise_en_service";
    const { error } = await sb.from("chantiers").update(ch).eq("id", c.id); if (error) { info("Erreur : " + error.message, true); return false; } Object.assign(c, ch); info(fini ? "Pose terminée, bravo 👍" : "Enregistré"); return true; };
  document.getElementById("photo").onchange = async (e) => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    const ch = `${c.id}/${Date.now()}.${(f.type.split("/")[1] || "jpg").replace("jpeg", "jpg")}`; const { error } = await sb.storage.from("chantiers").upload(ch, f, { contentType: f.type });
    if (error) return info("Photo non envoyée : " + error.message, true); photos.push(ch); dessiner(); sauver(false); };
  document.getElementById("sauver").onclick = () => sauver(false);
  document.getElementById("fini").onclick = async () => { if (!P.terminee_le && !confirm("La pose est bien terminée ? Yann sera prêt pour la mise en service.")) return; if (await sauver(true)) { await charger(); rendre(); } };
}

/* ---------- Équipe (bureau) ---------- */
function vueEquipe() {
  const METIER = { technicien: "Technicien SAV", poseur: "Poseur", les_deux: "SAV et pose" };
  app.innerHTML = `<section class="carte"><h2>Équipe terrain</h2><p class="meta">Chaque personne ne voit que ses interventions et ses chantiers : jamais les devis, les prix ou les autres clients.</p>
    ${L.equipe.map((m) => `<div class="membre"><div><b>${esc(m.nom)}</b><br><span class="meta">${esc(METIER[m.metier])} · ${esc(m.email)}${m.actif ? "" : " · désactivé"}</span></div><div style="display:flex;gap:6px"><button class="btn" style="min-height:40px;padding:0 12px" data-actif="${esc(m.email)}">${m.actif ? "Désactiver" : "Réactiver"}</button><button class="btn danger" style="min-height:40px;padding:0 12px" data-suppr="${esc(m.email)}" aria-label="Retirer">🗑</button></div></div>`).join("") || `<p class="vide">Personne pour l'instant.</p>`}</section>
  <form class="carte" id="ajout"><h2>Ajouter quelqu'un</h2>
    <label class="champ">Nom<input type="text" id="a-nom" required></label><label class="champ">E-mail<input type="email" id="a-email" required></label><label class="champ">Téléphone<input type="tel" id="a-tel"></label>
    <label class="champ">Il s'occupe de<select id="a-metier"><option value="technicien">SAV (interventions)</option><option value="poseur">Pose (chantiers)</option><option value="les_deux">Les deux</option></select></label>
    <button class="btn teal large">Ajouter</button>
    <p class="meta" style="margin-top:10px">Ensuite, envoyez-lui ce lien : <b>${esc(location.origin + location.pathname)}</b>. Il tape son e-mail, touche « Première connexion », ouvre le lien reçu, puis choisit son mot de passe.</p></form>`;
  app.querySelectorAll("[data-actif]").forEach((b) => (b.onclick = async () => { const m = L.equipe.find((x) => x.email === b.dataset.actif); await sb.from("equipe_terrain").update({ actif: !m.actif }).eq("email", m.email); await charger(); rendre(); }));
  app.querySelectorAll("[data-suppr]").forEach((b) => (b.onclick = async () => { if (!confirm("Retirer cette personne de l'équipe ? Elle n'aura plus accès à l'application.")) return; await sb.from("equipe_terrain").delete().eq("email", b.dataset.suppr); await charger(); rendre(); }));
  document.getElementById("ajout").onsubmit = async (e) => { e.preventDefault(); const g = (id) => document.getElementById(id).value.trim();
    const { error } = await sb.from("equipe_terrain").insert({ nom: g("a-nom"), email: g("a-email").toLowerCase(), telephone: g("a-tel") || null, metier: g("a-metier") });
    if (error) return info(error.code === "23505" ? "Cette adresse est déjà dans l'équipe." : "Erreur : " + error.message, true); info("Ajouté à l'équipe"); await charger(); rendre(); };
}

sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" && !MOI) demarrer(); });
demarrer();
})();
</script>
</body>
</html>
